name: Android Build CI

on:
  workflow_dispatch:          # 手动触发
  # push:                     # 可选：推送到特定分支时触发
  #   branches: [ main ]
  # pull_request:             # 可选：PR 时触发
  #   branches: [ main ]

# 权限声明（upload-artifact@v4 需要）
permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 如果项目包含子模块

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'      # 与项目要求一致
          cache: true              # 缓存 go mod 依赖

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'       # Android SDK 需要 Java 17

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true         # 链接到 SDK 路径，使 ANDROID_NDK_ROOT 自动设置

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708   # 指定版本，避免不稳定

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH   # 将 gomobile 加入 PATH

      - name: Initialize gomobile
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          gomobile init

      - name: Download Go dependencies
        run: go mod download

      - name: Build Android APK with gomobile
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 使用 gomobile 构建 APK，主包路径为 ./cmd/ikemen
          # 输出文件名为 Ikemen_GO_android.apk
          gomobile build -target=android -o Ikemen_GO_android.apk ./cmd/ikemen

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ikemen-GO-Android-${{ github.run_number }}
          path: Ikemen_GO_android.apk
          if-no-files-found: error
          retention-days: 7