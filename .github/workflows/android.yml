# 在Build之前添加诊断步骤
- name: Diagnostic - Find Go Files
  run: |
    echo "=== Diagnostic Mode ==="
    echo "1. Current directory structure:"
    tree -L 3 -I 'node_modules|.git' || find . -type d -maxdepth 3
    
    echo "\n2. Looking for go.mod files:"
    find . -name "go.mod" -type f
    
    echo "\n3. Looking for Go source files:"
    find . -name "*.go" -type f | head -20
    
    echo "\n4. Checking for Android build scripts:"
    find . -name "*android*.sh" -o -name "build*.sh"
    
    echo "\n5. Project structure (if Ikemen-GO typical layout):"
    # 检查是否是标准的IKEMEN Go布局
    if [ -d "src" ]; then
      echo "src/ exists"
      ls -la src/
    fi
    
    if [ -d "mobile" ]; then
      echo "mobile/ exists" 
      ls -la mobile/
    fi
# 修正后的Build步骤
- name: Build Ikemen GO Android
  env:
    ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
    ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
    CGO_ENABLED: 1
    GOOS: android
    GOARCH: arm64
    CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
    CXX: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
  run: |
    echo "=== Debug Info ==="
    pwd
    ls -la
    
    # 安装gomobile工具
    go install golang.org/x/mobile/cmd/gomobile@latest
    go install golang.org/x/mobile/cmd/gobind@latest
    
    # 初始化gomobile
    export PATH=$PATH:$(go env GOPATH)/bin
    gomobile init
    
    # 查找正确的源文件位置
    if [ -d "mobile" ]; then
      echo "Mobile directory found, building from mobile/"
      cd mobile
      
      # 如果是Flutter项目
      if [ -f "pubspec.yaml" ]; then
        echo "Flutter project detected"
        flutter pub get
        flutter build apk --release
      # 如果是纯Go mobile项目  
      elif [ -f "go.mod" ]; then
        echo "Go mobile project detected"
        # 构建Android库
        gomobile bind -target=android -o Ikemen_GO.aar .
      fi
      
    # 检查是否在src目录有Go文件
    elif [ -d "src" ] && [ -f "src/main.go" ]; then
      echo "Building from src/ with gomobile"
      cd src
      
      # 创建Android应用包
      gomobile build -target=android -o Ikemen_GO.apk .
      
    # 检查根目录的Go文件
    elif [ -f "main.go" ] || [ -f "*.go" ]; then
      echo "Building from root with gomobile"
      
      # 创建Android应用包
      gomobile build -target=android -o Ikemen_GO.apk .
      
    else
      echo "Searching for Go files..."
      find . -name "*.go" -type f | head -20
      
      # 尝试自动检测
      if [ -d "cmd/ikemen" ]; then
        echo "Found cmd/ikemen, building..."
        cd cmd/ikemen
        gomobile build -target=android -o Ikemen_GO.apk .
      else
        echo "Error: No Go source files found for Android build!"
        exit 1
      fi
    fi