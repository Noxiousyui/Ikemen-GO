name: Android Build CI

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果有子模块的话
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
        
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Ikemen GO Android
        run: |
          # 显示当前目录结构以便调试
          echo "Current directory: $(pwd)"
          ls -la
          
          # 检查是否在 src 子目录
          if [ -d "src" ]; then
            echo "Found src directory, entering it..."
            cd src
          fi
          
          # 检查 go.mod 文件位置
          if [ ! -f "go.mod" ]; then
            echo "Error: go.mod not found!"
            find .. -name "go.mod" -type f 2>/dev/null || true
            exit 1
          fi
          
          echo "Go module found at: $(pwd)"
          cat go.mod
          
          # 下载依赖
          go mod tidy
          go mod download
          
          # 设置 Android 环境变量
          export ANDROID_SDK=$ANDROID_SDK_ROOT
          export ANDROID_NDK=$ANDROID_NDK_ROOT
          export CGO_ENABLED=1
          
          # 如果是 Android 交叉编译，需要设置目标架构
          # 常见的 Android 架构: arm64-v8a, armeabi-v7a, x86_64, x86
          export GOOS=android
          export GOARCH=arm64
          export CC=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          
          # 构建
          if [ -f "../build_android.sh" ]; then
            echo "Using build_android.sh script..."
            chmod +x ../build_android.sh
            cd .. && ./build_android.sh
          elif [ -f "build_android.sh" ]; then
            echo "Using build_android.sh script in current dir..."
            chmod +x build_android.sh
            ./build_android.sh
          else
            echo "Building with go build..."
            go build -v -o Ikemen_GO_android .
          fi
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: |
            src/Ikemen_GO_android
            Ikemen_GO_android
            *.apk
            export/release/android/bin/app/build/outputs/apk/debug
        if-no-files-found: warn
